<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0C18">
<title>Yılbaşı Çekilişi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Coiny&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="/gorseller/sahne.webp">
<style>
/* =========================================================
   YILBAŞI ÇEKİLİŞİ
   Sıcak ışıklı kış gecesi · ahşap & altın sandık · karlı paneller
   ========================================================= */
:root {
  --gece-1: #0B0A14; --gece-2: #15121F; --gece-3: #241E36;
  --panel: rgba(46, 33, 58, .88); --panel-2: rgba(30, 22, 42, .94);
  --kirmizi: #E8392F; --kirmizi-koyu: #A61E17; --yesil: #3BA55C; --yesil-koyu: #22703A;
  --altin: #FFC94D; --altin-koyu: #D98E1F; --krem: #FFF6E8; --kar: #F4F6FF;
  --yazi: #FFF8EE; --soluk: #BDB2C9; --cizgi: rgba(255, 214, 150, .18);
  --f-baslik: 'Baloo 2', 'Nunito', system-ui, sans-serif; --f-gosteri: 'Coiny', 'Baloo 2', system-ui, sans-serif;
  --f-govde: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --yay: cubic-bezier(.2, 1.4, .4, 1);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; color: var(--yazi); font-family: var(--f-govde); font-size: 16px; line-height: 1.55; font-weight: 600; overflow-x: hidden;
  background: linear-gradient(180deg, var(--gece-1) 0%, var(--gece-2) 45%, var(--gece-3) 100%) fixed; }
.gizli { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--altin); outline-offset: 3px; border-radius: 10px; }
::selection { background: var(--kirmizi); color: #fff; }
button { font: inherit; cursor: pointer; color: inherit; }
a { color: var(--altin); }

/* ---------- katmanlar: 0 sıcak ışık · 1 kar · 2 süsler · 3 içerik · 4 biriken kar ---------- */
.isik-katman { position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(800px 500px at 75% 30%, rgba(255, 170, 70, .1), transparent 70%), radial-gradient(700px 400px at 10% 90%, rgba(255, 120, 60, .08), transparent 70%); }
#kar { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
#yigin { position: fixed; left: 0; right: 0; bottom: 0; width: 100%; height: 90px; z-index: 4; pointer-events: none; }
.kabuk { position: relative; z-index: 3; max-width: 1200px; margin: 0 auto; padding: 0 20px calc(110px + env(safe-area-inset-bottom)); }

/* ---------- köşe süsleri ---------- */
.susler { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
.agac { position: absolute; left: -16px; bottom: 6px; width: 250px; filter: drop-shadow(0 0 30px rgba(255, 190, 80, .25)); }
.kose-sag { position: absolute; right: -10px; bottom: 6px; width: 310px; }
.asili { position: absolute; top: 0; width: 120px; }
.asili.sol { left: 18px; } .asili.sag { right: 18px; }
.asili g.top { animation: sallan 4s ease-in-out infinite; }
.asili g.top:nth-child(2) { animation-delay: -1.3s; animation-duration: 5s; }
.asili g.top:nth-child(3) { animation-delay: -2.4s; animation-duration: 4.5s; }
@keyframes sallan { 0%, 100% { transform: rotate(4deg); } 50% { transform: rotate(-4deg); } }
.ampul-isik { animation: isil 2s ease-in-out infinite; filter: drop-shadow(0 0 5px #FFD86B); }
@keyframes isil { 50% { opacity: .35; } }
.yildiz-parla { transform-box: fill-box; transform-origin: center; animation: yildiz 2.6s ease-in-out infinite; filter: drop-shadow(0 0 14px #FFC94D); }
@keyframes yildiz { 50% { transform: scale(1.12); filter: drop-shadow(0 0 22px #FFD86B); } }
@media (max-width: 1400px) { .agac { width: 180px; } .kose-sag { width: 230px; } .asili { width: 90px; } }
@media (max-width: 860px) { .agac { width: 110px; left: -18px; } .kose-sag { width: 140px; right: -12px; } }
@media (max-width: 600px) { .asili { display: none; } }

/* altın çizgi süsler (pırıltılar, kar taneleri) */
.altin-cizgi { position: absolute; color: #E9C677; opacity: .55; animation: pirilti 3.5s ease-in-out infinite; }
@keyframes pirilti { 50% { opacity: .15; transform: scale(.8) rotate(20deg); } }
@media (max-width: 860px) { .altin-cizgi { display: none; } }

/* buz sarkıtları + ışık zinciri */
.zincir { position: relative; height: 40px; margin: 0 -20px; overflow: hidden; }
#buzSvg { position: absolute; left: 0; top: 0; width: 100%; height: 34px; }
.zincir svg { width: 100%; height: 40px; display: block; }
.ampul { animation: isil 1.9s ease-in-out infinite; }

/* ---------- üst bar ---------- */
.ust { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 4px 0 18px; }
.logo { font-family: var(--f-baslik); font-weight: 700; font-size: 26px; line-height: 1; color: var(--yazi); text-decoration: none; white-space: nowrap; letter-spacing: .01em; }
.logo span { color: var(--altin); }
@media (max-width: 600px) { .logo { font-size: 21px; } #navNasil .uzun { display: none; } }
@media (min-width: 601px) { #navNasil .kisa { display: none; } }

/* ---------- karlı paneller ---------- */
.kart { position: relative; border-radius: 24px; padding: 26px 24px 24px; margin-top: 10px;
  background: linear-gradient(180deg, var(--panel), var(--panel-2)); border: 2px solid var(--cizgi);
  box-shadow: 0 18px 40px -18px rgba(0, 0, 0, .7), inset 0 1px 0 rgba(255, 255, 255, .06); }
/* panelin üstüne yağan kar gerçekten birikir (JS çizer) */
.kart > canvas.ust-kar { position: absolute; left: 6px; top: -30px; width: calc(100% - 12px); height: 32px; pointer-events: none; z-index: 2; }
.kart.sicak { border-color: rgba(255, 201, 77, .45); background: linear-gradient(180deg, rgba(74, 46, 52, .9), rgba(38, 24, 36, .95)); }
.kart h2, .kart h3 { font-family: var(--f-baslik); font-weight: 600; margin: 0; line-height: 1.15; }
.kart-ust { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.kart-ust h2, .kart-ust h3 { font-size: 22px; }
.etiket-ust { font-family: var(--f-baslik); font-weight: 600; font-size: 14px; color: var(--altin); letter-spacing: .02em; }
.etiket-ust.yesil { color: #7DDC92; } .etiket-ust.kirmizi { color: #FF7D6E; }
.soluk { color: var(--soluk); font-weight: 600; }
.hata { font-size: 14.5px; color: #FF8C80; min-height: 1.2em; margin-top: 10px; }

/* ---------- şeker butonlar ---------- */
.btn { --u: #F0473B; --a: #C8241C; --g: #8E1712; --y: #fff;
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 999px;
  padding: 14px 28px; font-family: var(--f-baslik); font-weight: 600; font-size: 18px; color: var(--y); text-decoration: none; white-space: nowrap;
  background: linear-gradient(180deg, var(--u), var(--a)); overflow: hidden;
  box-shadow: 0 5px 0 var(--g), 0 12px 22px -6px rgba(0, 0, 0, .5), inset 0 2px 0 rgba(255, 255, 255, .35);
  transition: transform .12s, box-shadow .12s, filter .2s; }
.btn::after { content: ""; position: absolute; inset: 0; border-radius: inherit; opacity: 0; transition: opacity .25s;
  background: repeating-linear-gradient(-45deg, rgba(255, 255, 255, .22) 0 10px, transparent 10px 20px); background-size: 200% 100%; animation: serit 1.2s linear infinite; }
@keyframes serit { to { background-position: -28px 0; } }
.btn:hover::after { opacity: 1; }
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--g), 0 4px 10px -4px rgba(0, 0, 0, .5), inset 0 2px 0 rgba(255, 255, 255, .3); }
.btn:disabled { --u: #5A4E66; --a: #463B52; --g: #2E2638; --y: #B9AEC6; cursor: not-allowed; transform: none; }
.btn:disabled::after { display: none; }
.btn.altin { --u: #FFD873; --a: #F0A929; --g: #A86A12; --y: #4A2205; }
.btn.yesil { --u: #4FC06F; --a: #2B8A47; --g: #1A5A2D; }
.btn.buyuk { padding: 17px 36px; font-size: 21px; }
.btn.ince { --u: transparent; --a: transparent; --g: transparent; color: var(--krem); border: 2px solid rgba(255, 246, 232, .45); box-shadow: none; padding: 12px 24px; }
.btn.ince:hover { background: rgba(255, 246, 232, .08); }
.btn.ince:active { transform: translateY(1px); }
.metin-btn { background: none; border: 0; color: var(--soluk); text-decoration: underline; text-underline-offset: 3px; padding: 6px 0; font-size: 14.5px; font-weight: 700; }
.metin-btn:hover { color: var(--yazi); }

/* ---------- girdiler ---------- */
.girdi-sar { display: flex; gap: 12px; align-items: center; }
@media (max-width: 520px) { .girdi-sar { flex-direction: column; align-items: stretch; } }
.girdi { flex: 1; min-width: 0; font: inherit; font-size: 17px; font-weight: 700; color: var(--yazi); padding: 15px 18px; border-radius: 16px;
  background: rgba(14, 10, 22, .6); border: 2px solid rgba(255, 220, 160, .2); }
.girdi::placeholder { color: #7D7190; }
.girdi:focus { outline: none; border-color: var(--altin); box-shadow: 0 0 0 4px rgba(255, 201, 77, .18); }
label.etiket { display: block; font-family: var(--f-baslik); font-weight: 500; font-size: 15px; color: var(--soluk); margin-bottom: 8px; }
.kod-alan { position: relative; }
.kod-alan input { position: absolute; inset: 0; opacity: 0; z-index: 2; width: 100%; height: 100%; font-size: 16px; }
.hucreler { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.hucre { aspect-ratio: .86; display: grid; place-items: center; font-family: var(--f-baslik); font-weight: 700; font-size: clamp(24px, 5.5vw, 32px); color: var(--kirmizi-koyu);
  background: var(--krem); border-radius: 14px; box-shadow: inset 0 -5px 0 #E6D3B3, 0 4px 10px rgba(0, 0, 0, .25); transition: transform .15s var(--yay), box-shadow .2s; }
.hucre:not(:empty) { animation: zipla .3s var(--yay); }
.kod-alan.odak .hucre.aktif { box-shadow: inset 0 -5px 0 #E6D3B3, 0 0 0 3px var(--altin); }
.kod-alan.odak .hucre.aktif:empty::before { content: ""; width: 3px; height: 42%; border-radius: 2px; background: var(--kirmizi); animation: imlec 1s steps(2) infinite; }
@keyframes imlec { 50% { opacity: 0; } }
@keyframes zipla { 40% { transform: translateY(-6px) scale(1.06); } }

/* ---------- HERO ---------- */
.hero { display: grid; grid-template-columns: .95fr 1.05fr; align-items: center; gap: 12px; padding: 6px 0 40px; }
/* başlık: kırmızı harfler, altın kontur, kabartma gölge */
.hero h1 { font-family: var(--f-gosteri); font-weight: 400; margin: 6px 0 4px; line-height: .98; letter-spacing: .01em; }
.hero h1 .ince-satir { display: block; font-family: var(--f-baslik); font-weight: 700; font-size: clamp(30px, 4vw, 48px); color: var(--krem); letter-spacing: .02em;
  text-shadow: 0 3px 0 rgba(0, 0, 0, .3), 0 0 26px rgba(255, 200, 120, .35); }
.hero h1 .ana-satir { display: block; font-size: clamp(56px, 8.4vw, 108px); color: var(--kirmizi); -webkit-text-stroke: 5px #FFD36A; paint-order: stroke fill;
  text-shadow: 0 6px 0 #7E120C, 0 9px 0 #4E0A07, 0 14px 22px rgba(0, 0, 0, .55), 0 0 40px rgba(255, 190, 90, .25); }
.susleme { display: flex; align-items: center; gap: 12px; color: #E9C677; font-family: var(--f-baslik); font-weight: 600; font-size: 15px; letter-spacing: .14em; margin: 10px 0 18px; }
.susleme::before, .susleme::after { content: ""; height: 2px; width: 60px; background: linear-gradient(90deg, transparent, #E9C677); }
.susleme::after { transform: scaleX(-1); }
.hero p.alt { font-size: 18.5px; color: #E2D8EA; max-width: 470px; margin: 0 0 26px; font-weight: 600; }
.hero-aksiyon { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin-top: 28px; }
.hero-gorsel { position: relative; }
.hero-gorsel img { width: 112%; max-width: none; margin-left: -6%; height: auto; display: block; animation: suzul 7s ease-in-out infinite;
  -webkit-mask-image: radial-gradient(ellipse 58% 56% at 52% 52%, #000 62%, transparent 100%); mask-image: radial-gradient(ellipse 58% 56% at 52% 52%, #000 62%, transparent 100%); }
.hero-gorsel::before { content: ""; position: absolute; inset: 15% 10%; background: radial-gradient(circle, rgba(255, 180, 70, .28), transparent 65%); filter: blur(20px); }
@keyframes suzul { 50% { transform: translateY(-8px); } }
@media (max-width: 860px) {
  .hero { grid-template-columns: 1fr; text-align: center; padding: 0 0 24px; gap: 0; }
  .hero-gorsel { order: -1; margin: -6px -20px 0; }
  .hero-gorsel img { width: 100%; margin: 0; }
  .hero p.alt { margin-left: auto; margin-right: auto; font-size: 16.5px; }
  .susleme { justify-content: center; }
  .hero h1 .ana-satir { -webkit-text-stroke-width: 4px; }
  .hero-aksiyon { justify-content: center; } .hero-aksiyon .btn { width: 100%; }
}

/* geri sayım: hediye paketleri */
.sayac-etiket { font-family: var(--f-baslik); font-weight: 500; font-size: 15px; color: var(--soluk); margin-bottom: 14px; }
.sayac { display: flex; gap: 12px; }
@media (max-width: 860px) { .sayac { justify-content: center; } }
.paket { position: relative; min-width: 78px; padding: 16px 8px 8px; text-align: center; border-radius: 14px; background: linear-gradient(180deg, #E8463A, #B92A20);
  box-shadow: inset 0 -5px 0 rgba(0, 0, 0, .2), 0 8px 16px -6px rgba(0, 0, 0, .5); }
.paket:nth-child(even) { background: linear-gradient(180deg, #45B566, #2A8443); }
.paket::before { content: ""; position: absolute; left: 0; right: 0; top: 10px; height: 7px; background: linear-gradient(180deg, #FFDA7A, #E6A22C); }
.paket::after { content: ""; position: absolute; left: 50%; top: -9px; width: 30px; height: 16px; margin-left: -15px;
  background: radial-gradient(7px 7px at 7px 8px, #FFD266 95%, transparent), radial-gradient(7px 7px at 23px 8px, #FFD266 95%, transparent), radial-gradient(4px 4px at 15px 9px, #E39A23 95%, transparent); }
.paket b { position: relative; display: block; font-family: var(--f-baslik); font-weight: 700; font-size: 34px; line-height: 1.05; font-variant-numeric: tabular-nums; color: #fff; text-shadow: 0 2px 0 rgba(0, 0, 0, .25); }
.paket span { font-family: var(--f-baslik); font-weight: 600; font-size: 12.5px; color: rgba(255, 255, 255, .85); }
@media (max-width: 400px) { .paket { min-width: 0; flex: 1; } .paket b { font-size: 27px; } }

/* ---------- ana sayfa panelleri ---------- */
.ikili { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }
@media (max-width: 860px) { .ikili { grid-template-columns: 1fr; gap: 30px; } }
.kart-baslik { display: flex; gap: 14px; align-items: center; margin-bottom: 18px; }
.kart-baslik .ikon { width: 52px; height: 52px; flex: none; }
.kart-baslik h2 { font-size: 25px; }
.kart-baslik p { margin: 2px 0 0; color: var(--soluk); font-size: 15px; }

/* ---------- SANDIK (SVG) ---------- */
.sandik { display: block; width: 100%; height: auto; overflow: visible; }
.sandik .s-kapak { transform-box: view-box; transform-origin: 30px 116px; transition: transform .75s cubic-bezier(.3, 1.6, .5, 1); }
.sandik .s-isik { opacity: 0; transform-box: view-box; transform-origin: 160px 118px; transform: scale(.4); transition: opacity .4s, transform .8s var(--yay); }
.sandik .s-parilti { opacity: 0; transition: opacity .3s; }
.sandik-kap { position: relative; }
.sandik-kap::before { content: ""; position: absolute; inset: 0 5% 8%; background: radial-gradient(ellipse at 50% 60%, rgba(255, 186, 80, .4), transparent 65%); filter: blur(14px); animation: nefes 3.5s ease-in-out infinite; }
@keyframes nefes { 50% { opacity: .55; transform: scale(1.06); } }
.sandik-kap.salin .sandik { animation: salin 4s ease-in-out infinite; }
@keyframes salin { 50% { transform: translateY(-6px) rotate(-1.2deg); } }
.sandik-kap.zipla .sandik { animation: sZipla .42s var(--yay); }
@keyframes sZipla { 35% { transform: translateY(-20px) rotate(3deg) scale(1.04); } 70% { transform: translateY(2px) rotate(-2deg); } }
.sandik-kap.titre .sandik { animation: titre .09s linear infinite; }
@keyframes titre { 25% { transform: translate(-3px, 1px) rotate(-1.5deg); } 75% { transform: translate(3px, -1px) rotate(1.5deg); } }
.sandik-kap.acik .s-kapak { transform: rotate(-32deg) translate(-6px, -14px); }
.sandik-kap.acik .s-isik { opacity: 1; transform: scale(1); }
.sandik-kap.acik .s-parilti { opacity: 1; }
.sandik-kap.acik .sandik { animation: none; }

/* ---------- oda ---------- */
.oda-ust { display: grid; grid-template-columns: 1fr 230px; gap: 24px; align-items: center; padding: 0 0 22px; }
.oda-ust h1 { font-family: var(--f-baslik); font-weight: 700; font-size: clamp(36px, 5.4vw, 60px); line-height: 1; margin: 8px 0 16px; overflow-wrap: anywhere; text-shadow: 0 4px 0 rgba(0, 0, 0, .25); }
.cipler { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.cip { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px; font-weight: 700; font-size: 14.5px; background: rgba(255, 246, 232, .07); border: 2px solid var(--cizgi); }
.cip.yesil { color: #9BE8AE; border-color: rgba(125, 220, 146, .35); } .cip.yesil i { width: 8px; height: 8px; border-radius: 50%; background: #7DDC92; box-shadow: 0 0 8px #7DDC92; animation: isil 1.4s infinite; }
.cip.altin { color: var(--altin); border-color: rgba(255, 201, 77, .4); }
.cip b { color: var(--altin); letter-spacing: .08em; }
.cip button { background: none; border: 0; color: var(--altin); padding: 0 2px; font-weight: 800; }
@media (max-width: 860px) { .oda-ust { grid-template-columns: 1fr; } .oda-ust .sandik-kap { display: none; } }
.duzen { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 26px; align-items: start; }
.sol-kolon { display: grid; gap: 30px; min-width: 0; }
@media (max-width: 960px) { .duzen { grid-template-columns: 1fr; gap: 30px; } }
.durum h2 { font-size: clamp(26px, 3.6vw, 36px); margin: 6px 0 8px; }
.durum p { color: #E2D8EA; margin: 0 0 20px; }
.bekleme { display: flex; align-items: center; gap: 16px; padding: 16px; border-radius: 18px; background: rgba(14, 10, 22, .45); border: 2px dashed rgba(255, 220, 160, .2); }
.bekleme .celenk-mini { width: 58px; height: 58px; flex: none; animation: don 6s linear infinite; }
@keyframes don { to { transform: rotate(1turn); } }
.bekleme b { display: block; font-family: var(--f-baslik); font-weight: 600; font-size: 18px; }
.bekleme span { color: var(--soluk); font-size: 14.5px; }
.kisisel { margin-top: 18px; }
.kisisel summary { cursor: pointer; font-weight: 700; color: var(--soluk); font-size: 14.5px; }
.kisisel summary:hover { color: var(--yazi); }
.gizli-link { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; color: var(--altin); word-break: break-all; padding: 12px; border-radius: 12px; background: rgba(14, 10, 22, .6); border: 2px dashed rgba(255, 201, 77, .3); margin: 10px 0; }
.sandik-hazir { display: grid; grid-template-columns: 170px 1fr; gap: 22px; align-items: center; }
@media (max-width: 560px) { .sandik-hazir { grid-template-columns: 1fr; text-align: center; justify-items: center; } .sandik-hazir .sandik-kap { width: 170px; } }
.hedef-isim { display: block; font-family: var(--f-baslik); font-weight: 700; font-size: 30px; color: var(--altin); line-height: 1.1; margin-bottom: 4px; }
.davet { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 14px; border-radius: 16px; background: rgba(14, 10, 22, .5); border: 2px dashed rgba(255, 201, 77, .3); margin-bottom: 18px; }
.davet code { flex: 1; min-width: 180px; font-family: ui-monospace, Consolas, monospace; font-size: 13px; color: var(--altin); word-break: break-all; }
.davet .btn { padding: 9px 18px; font-size: 15px; }
.ilerleme { height: 14px; border-radius: 999px; background: rgba(255, 255, 255, .08); overflow: hidden; }
.ilerleme i { display: block; height: 100%; border-radius: 999px; transition: width .6s;
  background: repeating-linear-gradient(-45deg, #fff 0 8px, #E8392F 8px 16px); box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .15); }
.satir-yazi { display: flex; justify-content: space-between; font-weight: 700; font-size: 14.5px; color: var(--soluk); margin-bottom: 8px; }
.yonetici-alt { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-top: 20px; }
@media (max-width: 520px) { .yonetici-alt .btn { width: 100%; } }

/* lobi */
.lobi-liste { display: grid; gap: 10px; }
.oyuncu { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 18px; background: rgba(14, 10, 22, .4); border: 2px solid transparent; animation: gir .45s var(--yay) both; }
@keyframes gir { from { opacity: 0; transform: translateY(8px) scale(.97); } }
.oyuncu.sen { border-color: rgba(255, 201, 77, .5); background: rgba(255, 201, 77, .08); }
.avatar { position: relative; width: 44px; height: 44px; flex: none; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-baslik); font-weight: 700; font-size: 16px; color: #fff;

.avatar .sapka { position: absolute; width: 34px; top: -15px; right: -12px; transform: rotate(18deg); }
.oyuncu .bilgi { flex: 1; min-width: 0; }
.oyuncu .isim { display: block; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.oyuncu .alt { font-size: 13.5px; font-weight: 700; color: var(--soluk); }
.oyuncu .alt.hazir { color: #7DDC92; } .oyuncu .alt.acti { color: var(--altin); }
.sen-rozet { font-family: var(--f-baslik); font-weight: 600; font-size: 13px; padding: 3px 10px; border-radius: 999px; background: var(--altin); color: #4A2205; }
.at-btn { width: 34px; height: 34px; border-radius: 50%; border: 2px solid rgba(255, 140, 128, .4); background: transparent; color: #FF8C80; display: grid; place-items: center; padding: 0; font-size: 14px; font-weight: 800; }
.at-btn:hover { background: rgba(255, 140, 128, .15); }
.bos { padding: 22px; text-align: center; color: var(--soluk); border: 2px dashed var(--cizgi); border-radius: 18px; }
.bulunamadi { text-align: center; padding: 60px 20px; }
.bulunamadi .buyuk-emoji { font-size: 64px; }
.bulunamadi h2 { font-family: var(--f-baslik); font-size: 32px; margin: 12px 0 8px; }
.bulunamadi p { color: var(--soluk); margin: 0 auto 24px; max-width: 420px; }

/* ---------- hediye etiketi (sonuç kartı) ---------- */
.etiket-kart { position: relative; width: min(300px, 78vw); padding: 34px 22px 26px; text-align: center; color: #4A2A18; border-radius: 22px;
  background: linear-gradient(180deg, #FFF8EC, #F6E4C6); box-shadow: 0 20px 40px -10px rgba(0, 0, 0, .6), inset 0 -6px 0 #E6CFA5; }
.etiket-kart::before { content: ""; position: absolute; top: 12px; left: 50%; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: var(--gece-2); box-shadow: inset 0 2px 3px rgba(0, 0, 0, .5); }
.etiket-kart .kurdele { position: absolute; left: 50%; top: -46px; width: 4px; height: 58px; margin-left: -2px; background: var(--kirmizi); border-radius: 2px; }
.etiket-kart .ust { font-family: var(--f-baslik); font-weight: 600; font-size: 15px; color: #9A6A3A; margin-top: 8px; }
.etiket-kart .isim { font-family: var(--f-baslik); font-weight: 700; font-size: clamp(30px, 8vw, 40px); line-height: 1.05; color: var(--kirmizi-koyu); margin: 8px 0 6px; overflow-wrap: anywhere; }
.etiket-kart .not { font-size: 14px; font-weight: 700; color: #9A6A3A; }
.etiket-kart .holly { position: absolute; right: 14px; top: 10px; width: 46px; }

/* ---------- TAM EKRAN SAHNE ---------- */
.sahne { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 20px; overflow: auto;
  background: radial-gradient(circle at 50% 42%, rgba(70, 40, 60, .97), rgba(12, 10, 20, .99) 72%); animation: belir .3s ease; }
@keyframes belir { from { opacity: 0; } }
.sahne-ic { position: relative; width: 100%; max-width: 720px; display: grid; justify-items: center; text-align: center; gap: 12px; }
.sahne h2 { font-family: var(--f-baslik); font-weight: 700; font-size: clamp(30px, 6vw, 48px); margin: 0; line-height: 1.05; text-shadow: 0 4px 0 rgba(0, 0, 0, .3), 0 0 30px rgba(255, 190, 90, .35); }
.sahne .ipucu { font-family: var(--f-baslik); font-weight: 600; font-size: 18px; color: var(--altin); min-height: 1.5em; animation: isil 1.8s infinite; }
.vuruslar { display: flex; gap: 10px; }
.vuruslar i { width: 18px; height: 18px; border-radius: 50%; background: rgba(255, 255, 255, .15); transition: background .2s, transform .2s var(--yay); }
.vuruslar i.dolu { background: var(--kirmizi); transform: scale(1.15); box-shadow: 0 0 12px var(--kirmizi); }
.kapat-x { position: absolute; top: 16px; right: 16px; width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--cizgi); background: rgba(14, 10, 22, .7); font-size: 18px; font-weight: 800; z-index: 3; }
.acilis-alan { position: relative; width: min(420px, 90vw); display: grid; place-items: center; cursor: pointer; -webkit-tap-highlight-color: transparent; padding-top: 60px; }
.acilis-alan:focus { outline: none; }
.acilis-alan:focus-visible .sandik-kap::after { content: ""; position: absolute; inset: -8px; border: 3px dashed var(--altin); border-radius: 30px; }
.flas { position: fixed; inset: 0; background: #FFF4D6; opacity: 0; pointer-events: none; z-index: 5; }
.sahne.patladi .flas { animation: flas .8s ease-out; }
@keyframes flas { 15% { opacity: .85; } 100% { opacity: 0; } }
.sonuc-yer { position: absolute; left: 50%; top: 30px; transform: translate(-50%, 70px) scale(.3) rotate(-12deg); opacity: 0; transition: transform 1s var(--yay), opacity .35s; z-index: 4; pointer-events: none; }
.sahne.kart-acik .sonuc-yer { transform: translate(-50%, 0) scale(1) rotate(-3deg); opacity: 1; }
.sahne.kart-acik .acilis-alan .sandik-kap { opacity: .25; transform: translateY(80px) scale(.85); transition: opacity .6s, transform .8s var(--yay); }
.sahne-butonlar { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; opacity: 0; transition: opacity .4s .7s; }
.sahne.kart-acik .sahne-butonlar { opacity: 1; }
.celenk-buyuk { width: 210px; height: 210px; position: relative; margin: 6px 0; }
.celenk-buyuk svg { width: 100%; height: 100%; animation: don 5s linear infinite; }
.celenk-buyuk b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-baslik); font-weight: 700; font-size: 40px; text-shadow: 0 3px 0 rgba(0, 0, 0, .3); }
.eslesme-liste { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; max-width: 640px; margin-top: 6px; }
.e-oyuncu { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 92px; padding: 16px 6px 10px; border-radius: 18px; background: rgba(14, 10, 22, .55);
  border: 2px solid rgba(255, 255, 255, .08); transition: border-color .3s, transform .35s var(--yay), background .3s; }
.e-oyuncu small { font-weight: 800; font-size: 12.5px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.e-oyuncu em { font-style: normal; font-weight: 800; font-size: 12px; color: var(--soluk); }
.e-oyuncu.tamam { border-color: #7DDC92; background: rgba(59, 165, 92, .16); transform: translateY(-6px) rotate(-2deg); }
.e-oyuncu.tamam em { color: #9BE8AE; }
.sahne .ilerleme { width: min(420px, 80vw); }

/* ---------- bildirim (hediye etiketi) ---------- */
.bildirimler { position: fixed; top: 18px; right: 18px; z-index: 90; display: grid; gap: 10px; width: min(330px, calc(100vw - 36px)); pointer-events: none; }
@media (max-width: 600px) { .bildirimler { right: 50%; transform: translateX(50%); } }
.bildirim { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-radius: 18px; color: #4A2A18; background: linear-gradient(180deg, #FFF8EC, #F6E4C6);

.bildirim .e { font-size: 28px; }

.pencere { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 20px; background: rgba(6, 4, 12, .72); backdrop-filter: blur(4px); animation: belir .2s; }

.pencere .butonlar { display: flex; justify-content: flex-end; gap: 14px; flex-wrap: wrap; align-items: center; }
.pencere ol { list-style: none; padding: 0; margin: 0 0 20px; display: grid; gap: 12px; counter-reset: a; }
.pencere ol li { display: grid; grid-template-columns: 36px 1fr; gap: 12px; color: #E2D8EA; counter-increment: a; align-items: start; }
.pencere ol li::before { content: counter(a); width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-baslik); font-weight: 700; color: #fff;

#konfeti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 85; }
footer { margin-top: 60px; text-align: center; color: var(--soluk); font-size: 14.5px; font-weight: 700; }

  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
}

<script>
const $ = (s, el = document) => el.querySelector(s);
const uyg = $('#uygulama');
const params = new URLSearchParams(location.search);
const odaKodu = (params.get('oda') || '').toUpperCase();
const S = { oda: null, ben: null, yk: null, sahneAcik: false };
let yoklama = null, sayacZaman = null, svgNo = 0;

// ---------- yardımcılar ----------
function oku(k) { try { return localStorage.getItem(k); } catch { return null; } }

    kutu.setAttribute('aria-label', `Yılbaşına ${d[0]} gün ${d[1]} saat ${d[2]} dakika`);
  };
  guncelle(); sayacZaman = setInterval(guncelle, 1000);
}

// ---------- pencere ----------
function pencere(icerik, butonlar) {
  return new Promise((coz) => {
    const onceki = document.activeElement;
    const p = el(`<div class="pencere"><div class="kart" role="dialog" aria-modal="true" aria-labelledby="p-baslik">${icerik}<div class="butonlar"></div></div></div>`);
    const kapat = (d) => { p.remove(); document.removeEventListener('keydown', tus); onceki?.focus?.(); coz(d); };
    const tus = (e) => {
      if (e.key === 'Escape') kapat(false);
      if (e.key === 'Tab') { const f = [...p.querySelectorAll('button')], i = f.indexOf(document.activeElement);
        if (e.shiftKey && i <= 0) { e.preventDefault(); f.at(-1).focus(); } else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); } }
    };
    for (const b of butonlar) { const x = el(`<button class="${b.sinif || 'btn'}">${b.yazi}</button>`); x.onclick = () => kapat(b.deger); $('.butonlar', p).append(x); }
    p.addEventListener('click', (e) => { if (e.target === p) kapat(false); });
    document.addEventListener('keydown', tus); document.body.append(p); $('.butonlar button:last-child', p).focus();
  });
}
const onayla = (ust, baslik, mesaj, evet) => pencere(`<span class="etiket-ust">${ust}</span><h3 id="p-baslik">${baslik}</h3><p>${mesaj}</p>`,

// SAHNE: SANDIK AÇILIŞI
// =========================================================
const GEREKEN_DOKUNUS = 3;
function sandikSahnesi(tekrar) {
  const b = S.ben; if (!b?.hedef) return;
  S.sahneAcik = true; clearTimeout(yoklama);
  const onceki = document.activeElement;
  const s = el(`<div class="sahne" role="dialog" aria-modal="true" aria-labelledby="sa-b">
    <button class="kapat-x" aria-label="Kapat">✕</button><div class="flas"></div>
    <div class="sahne-ic">
      <span class="etiket-ust">🎁 Senin sandığın</span><h2 id="sa-b">Sandığını aç!</h2>
      <div class="acilis-alan" role="button" tabindex="0" aria-label="Sandık. Açmak için ${GEREKEN_DOKUNUS} kez dokun ya da Enter'a bas.">
        <div class="sandik-kap salin" style="width:100%">${sandikSvg()}</div>
        <div class="sonuc-yer"><div class="etiket-kart"><span class="kurdele"></span>${HOLLY}
          <div class="ust">Hediye alacağın kişi</div><div class="isim">${metin(b.hedef)}</div><div class="not">Bu bir sır 🤫</div></div></div>
      </div>
      <div class="ipucu" aria-live="polite">Sandığa dokun</div>
      <div class="vuruslar" aria-hidden="true">${'<i></i>'.repeat(GEREKEN_DOKUNUS)}</div>
      <div class="sahne-butonlar"><button class="btn altin buyuk" id="saKapat">Mutlu yıllar! 🎄</button></div>
    </div></div>`);
  document.body.append(s);
  const alan = $('.acilis-alan', s), kap = $('.sandik-kap', s), ipucu = $('.ipucu', s), vuruslar = s.querySelectorAll('.vuruslar i');
  let dokunus = 0, kilit = false, acildi = false;
  const kapat = () => { document.removeEventListener('keydown', tus); s.remove(); S.sahneAcik = false; onceki?.focus?.(); yukle(true); };
  const tus = (e) => { if (e.key === 'Escape' && !kilit) kapat(); };
  document.addEventListener('keydown', tus);
  $('.kapat-x', s).onclick = kapat; $('#saKapat', s).onclick = kapat;
  alan.focus();

  async function ac() {
    kilit = true; acildi = true;
    ipucu.textContent = 'Açılıyor…';
    kap.classList.remove('salin', 'zipla'); kap.classList.add('titre');
    await bekle(hareketAz() ? 0 : 900);
    kap.classList.remove('titre'); kap.classList.add('acik');
    s.classList.add('patladi');
    const r = kap.getBoundingClientRect();
    konfeti(r.left + r.width / 2, r.top + r.height * .45, undefined, 200);
    await bekle(hareketAz() ? 0 : 750);
    s.classList.add('kart-acik');
    $('#sa-b').textContent = 'İşte o kişi! 🎉';
    ipucu.textContent = ''; ipucu.style.animation = 'none';
    alan.setAttribute('aria-label', `Sandık açıldı. Hediye alacağın kişi: ${b.hedef}`);
    setTimeout(() => konfeti(innerWidth / 2, r.top, ['#FFC94D', '#ffffff', '#E8392F'], 120), 300);
    if (!tekrar) { try { const d = await istek(`odalar/${odaKodu}/ac`, { token: oku('token:' + odaKodu) }); b.acti = d.acti; } catch {} }
    kilit = false; $('#saKapat', s).focus();
  }
  function dokun() {
    if (kilit || acildi) return;
    dokunus++;
    vuruslar.forEach((v, i) => v.classList.toggle('dolu', i < dokunus));
    try { navigator.vibrate && navigator.vibrate(dokunus < GEREKEN_DOKUNUS ? 30 : [40, 40, 120]); } catch {}
    if (dokunus >= GEREKEN_DOKUNUS) return ac();
    kap.classList.remove('zipla', 'salin'); void kap.offsetWidth; kap.classList.add('zipla');
    ipucu.textContent = dokunus === GEREKEN_DOKUNUS - 1 ? 'Bir kez daha!' : 'Bir şeyler kıpırdıyor…';
  }
  alan.addEventListener('click', dokun);
  alan.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); dokun(); } });
}

async function yukle(zorla) {
  if (!odaKodu) { anaSayfa(); return; }
  let oda, ben = null;
  try { oda = await istek('odalar/' + odaKodu); }
  catch {
    uyg.innerHTML = `<section class="bulunamadi"><div class="buyuk-emoji" aria-hidden="true">⛄</div><h2>Çekiliş bulunamadı</h2>
      <p>${metin(odaKodu)} kodlu bir çekiliş yok. Kodu kontrol edip tekrar dene.</p><a class="btn" href="/">Ana sayfaya dön</a></section>`;
    return;
  }
  const token = oku('token:' + odaKodu);
  if (token) { try { ben = await istek(`odalar/${odaKodu}/ben?token=${encodeURIComponent(token)}`); } catch { yaz('token:' + odaKodu, null); } }
  const oncekiCekildi = S.oda?.cekildi;
  const degisti = zorla || JSON.stringify([oda, ben]) !== JSON.stringify([S.oda, S.ben]);
  S.oda = oda; S.ben = ben; S.yk = oku('yonetici:' + odaKodu);
  const yeniCekildi = oncekiCekildi === false && oda.cekildi;
  if (yeniCekildi && ben && !S.yk) bildirim('🎁', 'Eşleştirme tamamlandı', 'Sandığın hazır!');
  if (degisti && !S.sahneAcik) {
    const odak = document.activeElement, acikDetay = document.querySelector('details.kisisel[open]');
    if (!zorla && !yeniCekildi && ((odak && odak.matches('input')) || acikDetay)) { /* kullanıcı bir şeyle ilgilenirken bozma */ } else odaSayfasi();
  }
  clearTimeout(yoklama);
  yoklama = setTimeout(() => { if (!S.sahneAcik && !$('.pencere')) yukle(false); else yoklama = setTimeout(() => yukle(false), 4000); }, oda.cekildi ? 15000 : 4000);
}
yukle(true);
</script>
</body>
</html>
