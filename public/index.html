<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050B0B">
<title>Gizli Hediye · Yılbaşı Çekilişi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Exo+2:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   GİZLİ HEDİYE — yılbaşı etkinliği
   Gece · kar · kırmızı / yeşil / altın · 3D sandık
   ========================================================= */
:root {
  --bg: #050B0B; --panel: rgba(10, 22, 20, .84); --panel-2: rgba(18, 34, 30, .92);
  --yesil: #35E08A; --kirmizi: #FF3B4E; --altin: #FFC83D;
  --yazi: #F1F7F4; --soluk: #9DB3AA; --cizgi: rgba(160, 230, 200, .16);
  --f-oyun: 'Chakra Petch', 'Segoe UI', sans-serif;
  --f-govde: 'Exo 2', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --kirp: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
  --ease-yay: cubic-bezier(.2, 1.3, .4, 1);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--yazi); font-family: var(--f-govde); font-size: 16px; line-height: 1.5; overflow-x: hidden; }
.gizli { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--altin); outline-offset: 3px; }
::selection { background: var(--kirmizi); color: #fff; }
button { font: inherit; cursor: pointer; color: inherit; }
a { color: var(--yesil); }

/* ---------- katmanlar: 0 gök · 1 kar · 2 süsler · 3 içerik · 4 biriken kar ---------- */
.atmosfer { position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(900px 520px at 12% 105%, rgba(255, 59, 78, .2), transparent 62%),
    radial-gradient(900px 560px at 92% -8%, rgba(53, 224, 138, .16), transparent 60%),
    radial-gradient(700px 420px at 50% 40%, rgba(255, 200, 61, .06), transparent 70%),
    linear-gradient(180deg, #030707 0%, #061110 55%, #0A1A17 100%); }
#kar { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
#yigin { position: fixed; left: 0; right: 0; bottom: 0; width: 100%; height: 90px; z-index: 4; pointer-events: none; }
.kabuk { position: relative; z-index: 3; max-width: 1200px; margin: 0 auto; padding: 0 20px calc(110px + env(safe-area-inset-bottom)); }

/* ---------- süsler ---------- */
.susler { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
.agac { position: absolute; left: -10px; bottom: 18px; width: 200px; }
.hediyeler { position: absolute; right: -6px; bottom: 16px; width: 230px; }
.asili { position: absolute; top: 0; width: 120px; }
.asili.sol { left: 18px; } .asili.sag { right: 18px; }
.asili g.top { animation: sallan 4s ease-in-out infinite; }
.asili g.top:nth-child(2) { animation-delay: -1.3s; animation-duration: 5s; }
.asili g.top:nth-child(3) { animation-delay: -2.4s; animation-duration: 4.5s; }
@keyframes sallan { 0%, 100% { transform: rotate(4deg); } 50% { transform: rotate(-4deg); } }
.isik-yan { animation: isil 1.6s ease-in-out infinite; }
@keyframes isil { 50% { opacity: .25; } }
.yildiz-parla { transform-box: fill-box; transform-origin: center; animation: yildiz 2.4s ease-in-out infinite; }
@keyframes yildiz { 50% { transform: scale(1.18); filter: drop-shadow(0 0 10px #FFC83D); } }
@media (max-width: 1400px) { .agac { width: 150px; } .hediyeler { width: 170px; } .asili { width: 90px; } }
@media (max-width: 860px) { .agac { width: 96px; bottom: 10px; left: -14px; } .hediyeler { width: 110px; bottom: 8px; right: -10px; } .asili { width: 64px; opacity: .85; } .asili.sol { left: 4px; } .asili.sag { right: 4px; } }

/* ışık zinciri */
.zincir { position: relative; height: 40px; margin: 0 -20px; overflow: hidden; }
.zincir svg { width: 100%; height: 40px; display: block; }
.ampul { animation: isil 1.8s ease-in-out infinite; }

/* ---------- üst bar ---------- */
.ust { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 6px 0 18px; }
.logo { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--yazi); }
.logo-hex { width: 44px; height: 48px; display: grid; place-items: center; font-size: 21px;
  clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: linear-gradient(160deg, var(--kirmizi), #8E0E1D); filter: drop-shadow(0 0 12px rgba(255,59,78,.55)); }
.logo-ad { font-family: var(--f-oyun); font-weight: 700; font-size: 19px; letter-spacing: .08em; line-height: 1; }
.logo-ad small { display: block; font-size: 10.5px; letter-spacing: .32em; color: var(--yesil); margin-top: 5px; font-weight: 600; }
.logo-ad { white-space: nowrap; }
@media (max-width: 600px) {
  .asili { display: none; }
  .logo-ad { font-size: 16px; } .logo-ad small { letter-spacing: .2em; }
  #navNasil { padding: 10px 14px; } #navNasil .uzun { display: none; }
}
@media (min-width: 601px) { #navNasil .kisa { display: none; } }

/* ---------- paneller ---------- */
.cerceve { position: relative; padding: 1px; clip-path: var(--kirp);
  background: linear-gradient(135deg, rgba(53,224,138,.6), rgba(53,224,138,.12) 35%, rgba(255,255,255,.06) 60%, rgba(255,200,61,.5)); }
.cerceve > .ic { clip-path: var(--kirp); background: linear-gradient(180deg, var(--panel-2), var(--panel)); padding: 24px; height: 100%; }
.cerceve.altin { background: linear-gradient(135deg, var(--altin), rgba(255,200,61,.18) 40%, rgba(255,59,78,.35) 70%, var(--altin)); }
.cerceve.kirmizi { background: linear-gradient(135deg, var(--kirmizi), rgba(255,59,78,.15) 40%, rgba(53,224,138,.25) 70%, var(--kirmizi)); }
.panel-baslik { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.panel-baslik h2, .panel-baslik h3 { margin: 0; font-family: var(--f-oyun); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 20px; }
.ust-etiket { font-family: var(--f-oyun); font-size: 11.5px; letter-spacing: .28em; text-transform: uppercase; color: var(--yesil); font-weight: 600; }
.ust-etiket.altin { color: var(--altin); } .ust-etiket.kirmizi { color: var(--kirmizi); }
.soluk { color: var(--soluk); }
.hata { font-size: 14px; color: #FF8A96; min-height: 1.2em; margin-top: 10px; }

/* ---------- butonlar ---------- */
.oyun-btn { --c1: #FFDA6E; --c2: #FFB020; position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  border: 0; padding: 16px 30px; font-family: var(--f-oyun); font-weight: 700; font-size: 16px; letter-spacing: .14em; text-transform: uppercase; color: #2A1500;
  background: linear-gradient(180deg, var(--c1), var(--c2)); clip-path: polygon(12px 0, 100% 0, calc(100% - 12px) 100%, 0 100%);
  filter: drop-shadow(0 0 14px rgba(255,190,50,.45)); overflow: hidden; transition: transform .15s var(--ease-yay), filter .2s; text-decoration: none; }
.oyun-btn::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.65), transparent); transform: skewX(-20deg); transition: left .5s; }
.oyun-btn:hover::after { left: 120%; }
.oyun-btn:hover { filter: drop-shadow(0 0 22px rgba(255,190,50,.75)); transform: translateY(-1px); }
.oyun-btn:active { transform: scale(.96); }
.oyun-btn:disabled { --c1: #32443F; --c2: #24332F; color: #8FA59C; filter: none; cursor: not-allowed; transform: none; }
.oyun-btn.kirmizi { --c1: #FF6070; --c2: #D3182C; color: #fff; filter: drop-shadow(0 0 16px rgba(255,59,78,.55)); }
.oyun-btn.yesil { --c1: #6CF0AA; --c2: #1FB566; color: #00240F; filter: drop-shadow(0 0 14px rgba(53,224,138,.45)); }
.oyun-btn.buyuk { padding: 20px 40px; font-size: 18px; }
.cizgi-btn { border: 1px solid rgba(53,224,138,.5); background: rgba(53,224,138,.07); color: var(--yesil); padding: 12px 20px; font-family: var(--f-oyun); font-weight: 600;
  letter-spacing: .12em; text-transform: uppercase; font-size: 13px; clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%); transition: background .2s; text-decoration: none; display: inline-flex; align-items: center; }
.cizgi-btn:hover { background: rgba(53,224,138,.17); }
.metin-btn { background: none; border: 0; color: var(--soluk); text-decoration: underline; text-underline-offset: 3px; padding: 6px 0; font-size: 14px; }
.metin-btn:hover { color: var(--yazi); }

/* ---------- girdiler ---------- */
.girdi-sar { display: flex; gap: 10px; }
@media (max-width: 520px) { .girdi-sar { flex-direction: column; } .girdi-sar .oyun-btn { width: 100%; } }
.girdi { flex: 1; min-width: 0; font: inherit; font-size: 17px; color: var(--yazi); padding: 15px 16px; background: rgba(2, 10, 9, .7); border: 1px solid rgba(160,230,200,.25);
  clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
.girdi::placeholder { color: #5F7A70; }
.girdi:focus { outline: none; border-color: var(--yesil); box-shadow: inset 0 0 0 1px var(--yesil), 0 0 18px rgba(53,224,138,.22); }
label.etiket { display: block; font-family: var(--f-oyun); font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--soluk); margin-bottom: 8px; }
.kod-alan { position: relative; }
.kod-alan input { position: absolute; inset: 0; opacity: 0; z-index: 2; width: 100%; height: 100%; font-size: 16px; }
.hucreler { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.hucre { aspect-ratio: .85; display: grid; place-items: center; font-family: var(--f-oyun); font-weight: 700; font-size: clamp(22px, 5vw, 30px); color: var(--altin);
  background: rgba(2, 10, 9, .75); border: 1px solid rgba(255,200,61,.28); clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
  text-shadow: 0 0 12px rgba(255,200,61,.7); transition: border-color .2s, box-shadow .2s; }
.kod-alan.odak .hucre.aktif { border-color: var(--altin); box-shadow: inset 0 0 14px rgba(255,200,61,.3); }
.kod-alan.odak .hucre.aktif:empty::before { content: ""; width: 3px; height: 45%; background: var(--altin); animation: imlec 1s steps(2) infinite; }
@keyframes imlec { 50% { opacity: 0; } }

/* ---------- HERO ---------- */
.hero { display: grid; grid-template-columns: 1.05fr .95fr; align-items: center; gap: 24px; padding: 20px 0 36px; min-height: 540px; }
.hero h1 { font-family: var(--f-oyun); font-weight: 700; font-size: clamp(44px, 7.2vw, 92px); line-height: .92; margin: 14px 0 16px; text-transform: uppercase; }
.hero h1 .parla { display: block; background: linear-gradient(90deg, var(--kirmizi), #FF7A5C 30%, var(--altin) 65%, var(--yesil)); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 22px rgba(255,59,78,.3)); }
.hero p.alt { font-size: 18px; color: #C3D6CE; max-width: 470px; margin: 0 0 26px; }
.sezon { display: inline-flex; align-items: center; gap: 10px; padding: 7px 14px; background: rgba(255,200,61,.1); border: 1px solid rgba(255,200,61,.4);
  font-family: var(--f-oyun); font-size: 12px; letter-spacing: .24em; color: var(--altin); font-weight: 600; clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%); }
.sezon i { width: 8px; height: 8px; border-radius: 50%; background: var(--yesil); box-shadow: 0 0 10px var(--yesil); animation: canli 1.4s infinite; }
@keyframes canli { 50% { opacity: .3; } }
.hero-aksiyon { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin-top: 26px; }
@media (max-width: 860px) {
  .hero { grid-template-columns: 1fr; text-align: center; padding: 0 0 20px; min-height: 0; gap: 0; }
  .hero .sahne-kutu { order: -1; height: 300px; }
  .hero .sandik { --s: .92 !important; }
  .hero p.alt { margin-left: auto; margin-right: auto; font-size: 16px; }
  .hero-aksiyon { justify-content: center; }
  .hero-aksiyon .oyun-btn { width: 100%; }
}
.sayac { display: flex; gap: 10px; }
@media (max-width: 860px) { .sayac { justify-content: center; } }
.sayac-kutu { min-width: 74px; padding: 10px 8px 8px; text-align: center; background: rgba(2,10,9,.75); border: 1px solid var(--cizgi); clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
.sayac-kutu:nth-child(odd) b { text-shadow: 0 0 14px rgba(255,59,78,.7); } .sayac-kutu:nth-child(even) b { text-shadow: 0 0 14px rgba(53,224,138,.7); }
.sayac-kutu b { display: block; font-family: var(--f-oyun); font-weight: 700; font-size: 32px; line-height: 1; font-variant-numeric: tabular-nums; color: #fff; }
.sayac-kutu span { font-family: var(--f-oyun); font-size: 10.5px; letter-spacing: .22em; color: var(--soluk); }
.sayac-etiket { font-family: var(--f-oyun); font-size: 12px; letter-spacing: .22em; color: var(--soluk); margin-bottom: 8px; text-transform: uppercase; }
@media (max-width: 400px) { .sayac-kutu { min-width: 0; flex: 1; } .sayac-kutu b { font-size: 26px; } }

/* ---------- 3D SANDIK ---------- */
.sahne-kutu { position: relative; height: 500px; display: grid; place-items: center; }
.huzme { position: absolute; width: 760px; height: 760px; left: 50%; top: 50%; margin: -380px 0 0 -380px; border-radius: 50%; pointer-events: none;
  background: repeating-conic-gradient(from 0deg, rgba(255,200,61,.12) 0deg 5deg, transparent 5deg 22deg, rgba(53,224,138,.1) 22deg 27deg, transparent 27deg 45deg);
  mask-image: radial-gradient(circle, #000 0%, rgba(0,0,0,.6) 30%, transparent 62%); animation: don 40s linear infinite; }
@keyframes don { to { transform: rotate(1turn); } }
.aura { position: absolute; width: 420px; height: 420px; left: 50%; top: 50%; margin: -210px 0 0 -210px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, rgba(255,59,78,.4), rgba(255,200,61,.14) 45%, transparent 68%); filter: blur(10px); animation: nefes 4s ease-in-out infinite; }
@keyframes nefes { 50% { transform: scale(1.12); opacity: .8; } }
.zemin-halka { position: absolute; left: 50%; bottom: 70px; width: 340px; height: 70px; margin-left: -170px; border-radius: 50%;
  border: 2px solid rgba(255,200,61,.6); box-shadow: 0 0 30px rgba(255,200,61,.35), inset 0 0 30px rgba(255,200,61,.25); transform: perspective(400px) rotateX(10deg); }
.zemin-halka::after { content: ""; position: absolute; inset: 12px 40px; border-radius: 50%; border: 1px dashed rgba(53,224,138,.55); animation: don 12s linear infinite reverse; }
@media (max-width: 860px) { .huzme { width: 520px; height: 520px; margin: -260px 0 0 -260px; } .aura { width: 300px; height: 300px; margin: -150px 0 0 -150px; } .zemin-halka { width: 250px; height: 54px; margin-left: -125px; bottom: 34px; } }

.sandik { --w: 210px; --h: 130px; --d: 150px; --lh: 58px; --s: 1; --isik: var(--altin);
  position: relative; width: var(--w); height: calc(var(--h) + var(--lh)); perspective: 1000px; transform: scale(var(--s)); }
.sandik-3d { position: absolute; left: 0; top: var(--lh); width: var(--w); height: var(--h); transform-style: preserve-3d; transform: rotateX(-18deg) rotateY(-30deg); }
.sandik.salin .sandik-3d { animation: salin 10s ease-in-out infinite; }
@keyframes salin { 0%, 100% { transform: rotateX(-18deg) rotateY(-34deg) translateY(0); } 50% { transform: rotateX(-14deg) rotateY(30deg) translateY(-10px); } }
.yz { position: absolute; left: 0; top: 0; }
.g-on, .g-arka, .g-sol, .g-sag {
  background:
    linear-gradient(90deg, transparent 0 8%, #FFC83D 8% 12%, transparent 12% 88%, #FFC83D 88% 92%, transparent 92%),
    repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 2px, transparent 2px 26px),
    linear-gradient(180deg, #E0293C, #A3101F 70%, #6A0912);
  border: 3px solid #FFC83D; box-shadow: inset 0 0 22px rgba(255,200,61,.3), inset 0 -10px 20px rgba(0,0,0,.35); }
.g-on, .g-arka { width: var(--w); height: var(--h); }
.g-on { transform: translateZ(calc(var(--d) / 2)); }
.g-arka { transform: rotateY(180deg) translateZ(calc(var(--d) / 2)); }
.g-sol, .g-sag { width: var(--d); height: var(--h); left: calc((var(--w) - var(--d)) / 2); filter: brightness(.78); }
.g-sol { transform: rotateY(-90deg) translateZ(calc(var(--w) / 2)); }
.g-sag { transform: rotateY(90deg) translateZ(calc(var(--w) / 2)); }
.g-alt { width: var(--w); height: var(--d); top: calc((var(--h) - var(--d)) / 2); transform: rotateX(-90deg) translateZ(calc(var(--h) / 2)); background: #2A0408; box-shadow: 0 0 60px rgba(255,200,61,.45); }
.g-isik { width: var(--w); height: var(--d); top: calc((var(--h) - var(--d)) / 2); transform: rotateX(90deg) translateZ(calc(var(--h) / 2 - 3px));
  background: radial-gradient(circle, #fff 0%, var(--isik) 30%, rgba(0,0,0,.6) 75%); opacity: .25; transition: opacity .4s; }
.kilit { position: absolute; left: 50%; top: -6px; width: 44px; height: 54px; margin-left: -22px; background: linear-gradient(180deg, #FFE38A, #E0A21A); clip-path: polygon(0 0, 100% 0, 100% 70%, 50% 100%, 0 70%);
  display: grid; place-items: center; transform: translateZ(1px); }
.kilit::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle, #fff, var(--yesil) 50%, #0B6A3A); box-shadow: 0 0 14px var(--yesil); margin-top: -8px; }
.kapak { position: absolute; left: 0; top: calc(var(--lh) * -1); width: var(--w); height: var(--lh); transform-style: preserve-3d;
  transform-origin: 50% 100% calc(var(--d) / -2); transition: transform .8s cubic-bezier(.3, 1.5, .5, 1); }
.k-on, .k-arka { width: var(--w); height: var(--lh); }
.k-on, .k-arka, .k-sol, .k-sag, .k-ust {
  background: linear-gradient(90deg, transparent 0 8%, #FFC83D 8% 12%, transparent 12% 44%, #1FB566 44% 56%, transparent 56% 88%, #FFC83D 88% 92%, transparent 92%),
    linear-gradient(180deg, #F03A4C, #B3142A);
  border: 3px solid #FFC83D; box-shadow: inset 0 0 18px rgba(255,200,61,.3); }
.k-on { transform: translateZ(calc(var(--d) / 2)); }
.k-arka { transform: rotateY(180deg) translateZ(calc(var(--d) / 2)); }
.k-sol, .k-sag { width: var(--d); height: var(--lh); left: calc((var(--w) - var(--d)) / 2); filter: brightness(.78); }
.k-sol { transform: rotateY(-90deg) translateZ(calc(var(--w) / 2)); }
.k-sag { transform: rotateY(90deg) translateZ(calc(var(--w) / 2)); }
.k-ust { width: var(--w); height: var(--d); top: calc((var(--lh) - var(--d)) / 2); transform: rotateX(90deg) translateZ(calc(var(--lh) / 2)); filter: brightness(1.12); }
.k-alt { width: var(--w); height: var(--d); top: calc((var(--lh) - var(--d)) / 2); transform: rotateX(-90deg) translateZ(calc(var(--lh) / 2)); background: #3A0610; }
.k-ust::after { content: "❄"; position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px; display: grid; place-items: center; font-size: 28px; color: #fff;
  text-shadow: 0 0 14px #fff, 0 0 26px var(--yesil); }
.sandik.titre .sandik-3d { animation: titre .14s linear infinite; }
.sandik.titre.guclu .sandik-3d { animation-duration: .07s; }
@keyframes titre { 0% { transform: rotateX(-18deg) rotateY(-14deg) translate(-3px, 0); } 50% { transform: rotateX(-16deg) rotateY(-10deg) translate(3px, -2px); } 100% { transform: rotateX(-18deg) rotateY(-14deg) translate(-3px, 0); } }
.sandik.zipla .sandik-3d { animation: zipla .4s var(--ease-yay); }
@keyframes zipla { 40% { transform: rotateX(-18deg) rotateY(-12deg) translateY(-18px) scale(1.05); } }
.sandik.acik .kapak { transform: rotateX(118deg); }
.sandik.acik .g-isik { opacity: 1; }
.sandik.acik .sandik-3d { transform: rotateX(-24deg) rotateY(-12deg); animation: none; }

/* ---------- ana sayfa panelleri ---------- */
.ikili { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 860px) { .ikili { grid-template-columns: 1fr; } }
.panel-ikon { width: 46px; height: 46px; display: grid; place-items: center; font-size: 22px; clip-path: var(--kirp); background: rgba(255,200,61,.1); border: 1px solid rgba(255,200,61,.35); flex: none; }
.panel-ust { display: flex; gap: 14px; align-items: center; margin-bottom: 18px; }
.panel-ust h2 { margin: 0; font-family: var(--f-oyun); font-weight: 700; font-size: 22px; letter-spacing: .05em; text-transform: uppercase; line-height: 1.1; }
.panel-ust p { margin: 2px 0 0; color: var(--soluk); font-size: 14px; }
.bilgi-serit { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 28px; }

.sol-kolon { display: grid; gap: 22px; min-width: 0; }
@media (max-width: 960px) { .duzen { grid-template-columns: 1fr; } }
.durum h2 { font-family: var(--f-oyun); font-weight: 700; font-size: clamp(24px, 3.4vw, 34px); text-transform: uppercase; letter-spacing: .03em; margin: 6px 0 8px; line-height: 1.05; }
.durum p { color: #C3D6CE; margin: 0 0 20px; }
.bekleme { display: flex; align-items: center; gap: 16px; padding: 16px; background: rgba(2,10,9,.6); border: 1px solid var(--cizgi); margin-top: 6px; }

  background: radial-gradient(circle, rgba(53,224,138,.25) 2px, transparent 3px), repeating-radial-gradient(circle, transparent 0 8px, rgba(53,224,138,.18) 8px 9px); overflow: hidden; }
.radar::after { content: ""; position: absolute; inset: 0; background: conic-gradient(from 0deg, rgba(53,224,138,.7), transparent 25%); animation: don 2s linear infinite; border-radius: 50%; }
.bekleme b { display: block; font-family: var(--f-oyun); letter-spacing: .14em; text-transform: uppercase; }
.bekleme span { color: var(--soluk); font-size: 14px; }
.kisisel { margin-top: 18px; }
.kisisel summary { cursor: pointer; font-family: var(--f-oyun); font-size: 12.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--soluk); }

.gizli-link { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; color: var(--altin); word-break: break-all; padding: 12px; background: rgba(2,10,9,.7); border: 1px dashed rgba(255,200,61,.35); margin: 10px 0; }

/* ---------- hediye kartı (sonuç) ---------- */
.kart-sonuc { position: relative; aspect-ratio: .74; padding: 2px; clip-path: var(--kirp); background: linear-gradient(160deg, var(--altin), rgba(255,59,78,.5) 40%, rgba(53,224,138,.5) 65%, var(--altin)); }
.kart-sonuc > .ic { clip-path: var(--kirp); height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: space-between; text-align: center; padding: 20px 14px; position: relative; overflow: hidden;

.kart-sonuc > .ic::before { content: ""; position: absolute; inset: -50%; background: conic-gradient(from 0deg, transparent, rgba(255,200,61,.18), transparent 30%); animation: don 5s linear infinite; }
.kart-sonuc .ust-etiket, .kart-sonuc .ikon, .kart-sonuc .isim, .kart-sonuc .alt-yazi { position: relative; }
.kart-sonuc .ikon { font-size: 58px; filter: drop-shadow(0 0 18px var(--altin)); }
.kart-sonuc .isim { font-family: var(--f-oyun); font-weight: 700; font-size: clamp(24px, 6vw, 32px); text-transform: uppercase; letter-spacing: .03em; overflow-wrap: anywhere; line-height: 1.05; }
.kart-sonuc .alt-yazi { font-family: var(--f-oyun); font-size: 11px; letter-spacing: .22em; color: var(--soluk); }

/* ---------- SAHNE (tam ekran) ---------- */
.sahne { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 20px; overflow: hidden;
  background: radial-gradient(circle at 50% 45%, rgba(40, 10, 16, .97), rgba(2, 6, 5, .99) 70%); animation: belir .3s ease; }
@keyframes belir { from { opacity: 0; } }
.sahne-ic { position: relative; width: 100%; max-width: 760px; display: grid; justify-items: center; text-align: center; gap: 12px; }
.sahne h2 { font-family: var(--f-oyun); font-weight: 700; font-size: clamp(26px, 5vw, 44px); text-transform: uppercase; letter-spacing: .06em; margin: 0; text-shadow: 0 0 22px rgba(255,200,61,.45); }
.sahne .ipucu { font-family: var(--f-oyun); letter-spacing: .26em; text-transform: uppercase; color: var(--altin); font-size: 14px; min-height: 1.4em; animation: canli 1.6s infinite; }
.pipler { display: flex; gap: 8px; }
.pipler i { width: 26px; height: 6px; background: rgba(255,255,255,.12); clip-path: polygon(3px 0, 100% 0, calc(100% - 3px) 100%, 0 100%); transition: background .2s, box-shadow .2s; }
.pipler i.dolu { background: var(--kirmizi); box-shadow: 0 0 10px var(--kirmizi); }
.kapat-x { position: absolute; top: 16px; right: 16px; width: 44px; height: 44px; border: 1px solid var(--cizgi); background: rgba(2,10,9,.7); font-size: 18px; z-index: 3; }

.acilis-alan:focus-visible .zemin-halka { border-color: #fff; box-shadow: 0 0 40px rgba(255,255,255,.6); }
.acilis-alan .huzme { opacity: .6; transition: opacity .5s; }
.sahne.patladi .acilis-alan .huzme { opacity: 1; background: repeating-conic-gradient(from 0deg, rgba(255,200,61,.35) 0deg 6deg, transparent 6deg 16deg, rgba(255,59,78,.3) 16deg 22deg, transparent 22deg 30deg); animation-duration: 10s; }
.sahne.patladi .aura { background: radial-gradient(circle, rgba(255,220,120,.9), rgba(255,59,78,.3) 45%, transparent 68%); }

@keyframes flas { 0% { opacity: 0; } 15% { opacity: .9; } 100% { opacity: 0; } }
.sonuc-kart { width: min(290px, 76vw); opacity: 0; transform: translateY(40px) rotateY(90deg) scale(.6); transition: transform .9s var(--ease-yay), opacity .4s; position: absolute; z-index: 4; }
.sahne.kart-acik .sonuc-kart { opacity: 1; transform: none; }

.eslesme-radar { width: 200px; height: 200px; border-radius: 50%; position: relative; border: 1px solid rgba(53,224,138,.5); margin: 10px 0 6px;
  background: repeating-radial-gradient(circle, transparent 0 24px, rgba(53,224,138,.18) 24px 25px); box-shadow: 0 0 40px rgba(53,224,138,.25), inset 0 0 40px rgba(53,224,138,.15); overflow: hidden; }
.eslesme-radar::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 0deg, rgba(53,224,138,.65), transparent 22%); animation: don 1.4s linear infinite; }
.eslesme-radar b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-oyun); font-size: 40px; font-weight: 700; z-index: 2; text-shadow: 0 0 16px var(--yesil); }
.eslesme-liste { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 640px; }
.e-oyuncu { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 84px; padding: 10px 6px; background: rgba(2,10,9,.8); border: 1px solid var(--cizgi); transition: border-color .3s, box-shadow .3s, transform .3s var(--ease-yay); }

.toastlar { position: fixed; top: 18px; right: 18px; z-index: 90; display: grid; gap: 10px; width: min(340px, calc(100vw - 36px)); pointer-events: none; }

.pencere ol li::before { content: counter(a); width: 30px; height: 30px; display: grid; place-items: center; font-family: var(--f-oyun); font-weight: 700; color: #fff; background: var(--kirmizi); clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); }
.pencere ol b { color: var(--yazi); }

#konfeti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 85; }
footer { margin-top: 56px; padding-top: 18px; border-top: 1px solid var(--cizgi); color: var(--soluk); font-size: 13px; text-align: center; font-family: var(--f-oyun); letter-spacing: .12em; text-transform: uppercase; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
}

      <span class="logo-hex" aria-hidden="true">🎁</span>
      <span class="logo-ad">GİZLİ HEDİYE<small>YILBAŞI ÇEKİLİŞİ</small></span>
    </a>
    <button class="cizgi-btn" id="navNasil" aria-label="Nasıl oynanır?"><span class="uzun">Nasıl oynanır?</span><span class="kisa" aria-hidden="true">?</span></button>
  </header>
  <main id="uygulama"></main>
  <footer>Kimse kendine çıkmaz · Eşleşmeleri yönetici dahil kimse göremez</footer>
</div>
<div class="toastlar" id="toastlar" aria-live="polite"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const uyg = $('#uygulama');
const params = new URLSearchParams(location.search);
const odaKodu = (params.get('oda') || '').toUpperCase();
const S = { oda: null, ben: null, yk: null, sahneAcik: false };
let yoklama = null, sayacZaman = null;

// ---------- yardımcılar ----------
function oku(k) { try { return localStorage.getItem(k); } catch { return null; } }
function yaz(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} }
async function istek(yol, govde) {
  const r = await fetch('/api/' + yol, govde === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(govde) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.hata || 'Bir şeyler ters gitti.');
  return d;
}
function el(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function metin(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }
const bekle = (ms) => new Promise((r) => setTimeout(r, ms));
const hareketAz = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const buyuk = (s) => s.toLocaleUpperCase('tr-TR');
const odaLinki = (kod) => `${location.origin}/?oda=${kod}`;
function enterIle(girdi, buton) {
  $(girdi).addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); $(buton).click(); } });
}
function ozet(s) { let h = 2166136261; for (const c of s) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619) >>> 0; } return h; }
function basHarf(isim) { const p = isim.trim().split(/\s+/); return buyuk((p[0]?.[0] || '') + (p.length > 1 ? p[p.length - 1][0] : '')); }
const AVATAR = [['#FF3B4E', '#8E0E1D'], ['#35E08A', '#0E7A45'], ['#FFC83D', '#D97A10'], ['#FF7A5C', '#C3182B'], ['#2BB673', '#0F5A35'], ['#E8B84A', '#9C6A10']];
function avatar(isim) {
  const [a, b] = AVATAR[ozet(isim) % AVATAR.length];
  return `<span class="avatar" style="background:linear-gradient(150deg,${a},${b})" aria-hidden="true">${metin(basHarf(isim))}</span>`;
}
if (odaKodu && params.get('t')) { yaz('token:' + odaKodu, params.get('t')); history.replaceState(null, '', '/?oda=' + odaKodu); }

// ---------- bildirim & konfeti ----------
function bildirim(ust, baslik) {
  const t = el(`<div class="toast"><small>${metin(ust)}</small><b>${metin(baslik)}</b></div>`);
  $('#toastlar').append(t);
  setTimeout(() => { t.classList.add('cik'); setTimeout(() => t.remove(), 450); }, 3600);
}
function konfeti(x, y, renkler = ['#FF3B4E', '#35E08A', '#FFC83D', '#ffffff'], adet = 170) {
  if (hareketAz()) return;
  const tv = document.createElement('canvas'); tv.id = 'konfeti'; document.body.append(tv);
  const c = tv.getContext('2d'), dpr = devicePixelRatio || 1;
  tv.width = innerWidth * dpr; tv.height = innerHeight * dpr; c.scale(dpr, dpr);
  const p = Array.from({ length: adet }, () => {
    const a = Math.random() * Math.PI * 2, h = 3 + Math.random() * 11;
    return { x, y, vx: Math.cos(a) * h, vy: Math.sin(a) * h - 5, b: 3 + Math.random() * 6, r: renkler[(Math.random() * renkler.length) | 0], d: Math.random() * 6, dh: (Math.random() - .5) * .3, iz: Math.random() < .35 };
  });
  const bas = performance.now();
  (function kare(t) {
    const g = t - bas; c.clearRect(0, 0, innerWidth, innerHeight); c.globalAlpha = Math.max(0, 1 - Math.max(0, g - 2200) / 900);
    for (const q of p) {
      q.vx *= .975; q.vy = q.vy * .975 + .2; q.x += q.vx; q.y += q.vy; q.d += q.dh;
      c.save(); c.translate(q.x, q.y); c.rotate(q.d); c.fillStyle = q.r;
      if (q.iz) { c.shadowColor = q.r; c.shadowBlur = 12; c.beginPath(); c.arc(0, 0, q.b / 2, 0, Math.PI * 2); c.fill(); }
      else c.fillRect(-q.b / 2, -q.b / 4, q.b, q.b / 2);
      c.restore();
    }
    if (g < 3200) requestAnimationFrame(kare); else tv.remove();
  })(bas);
}

// ---------- kar yağışı + biriken kar ----------
(function kar() {
  const tv = $('#kar'), c = tv.getContext('2d'), yv = $('#yigin'), yc = yv.getContext('2d');
  const SUTUN = 6, YH = 90;
  let w, h, taneler = [], yigin = [], maxY;
  function boyut() {
    const dpr = Math.min(devicePixelRatio || 1, 2); w = innerWidth; h = innerHeight;
    tv.width = w * dpr; tv.height = h * dpr; c.setTransform(dpr, 0, 0, dpr, 0, 0);
    yv.width = w * dpr; yv.height = YH * dpr; yc.setTransform(dpr, 0, 0, dpr, 0, 0);
    maxY = w < 600 ? 34 : 64;
    const n = Math.ceil(w / SUTUN) + 1, eski = yigin;
    yigin = Array.from({ length: n }, (_, i) => eski[i] ?? (12 + Math.sin(i * .21) * 3 + Math.sin(i * .07) * 4));
    taneler = Array.from({ length: Math.round(Math.min(170, w / 7)) }, () => yeni(true));
    yiginCiz();
  }
  function yeni(rastgele) {
    const r = .7 + Math.random() * 2.6;
    return { x: Math.random() * w, y: rastgele ? Math.random() * h : -6, r, v: .35 + r * .32 + Math.random() * .3, s: Math.random() * 6, sal: .2 + Math.random() * .5, a: .45 + Math.random() * .5 };
  }
  function yiginCiz() {
    yc.clearRect(0, 0, w, YH);
    const g = yc.createLinearGradient(0, YH - maxY - 12, 0, YH);
    g.addColorStop(0, '#FFFFFF'); g.addColorStop(.5, '#EAF4FF'); g.addColorStop(1, '#C9DDF0');
    yc.beginPath(); yc.moveTo(0, YH);
    for (let i = 0; i < yigin.length; i++) yc.lineTo(i * SUTUN, YH - yigin[i]);
    yc.lineTo(w, YH); yc.closePath();
    yc.shadowColor = 'rgba(200,230,255,.55)'; yc.shadowBlur = 14; yc.fillStyle = g; yc.fill(); yc.shadowBlur = 0;
    yc.strokeStyle = 'rgba(255,255,255,.95)'; yc.lineWidth = 1.5; yc.beginPath();
    for (let i = 0; i < yigin.length; i++) yc[i ? 'lineTo' : 'moveTo'](i * SUTUN, YH - yigin[i] + 1);
    yc.stroke();
  }
  boyut(); addEventListener('resize', boyut);
  if (hareketAz()) { c.fillStyle = 'rgba(240,248,255,.7)'; taneler.forEach((t) => { c.beginPath(); c.arc(t.x, t.y, t.r, 0, Math.PI * 2); c.fill(); }); return; }
  let kareNo = 0;
  (function kare() {
    c.clearRect(0, 0, w, h);
    c.fillStyle = '#F4FAFF';
    for (let i = 0; i < taneler.length; i++) {
      const t = taneler[i];
      t.y += t.v; t.s += .012; t.x += Math.sin(t.s) * t.sal;
      if (t.x < -5) t.x = w + 5; else if (t.x > w + 5) t.x = -5;
      const sut = Math.max(0, Math.min(yigin.length - 1, Math.round(t.x / SUTUN)));
      if (t.y >= h - yigin[sut] + 1) {
        if (yigin[sut] < maxY) {           // tane yığına eklenir, komşulara yayılır
          const ek = t.r * 1.4;            // ~2-3 dakikada tam yığın
          yigin[sut] += ek;
          if (sut > 0) yigin[sut - 1] += ek * .5;
          if (sut < yigin.length - 1) yigin[sut + 1] += ek * .5;
        }
        taneler[i] = yeni(false); continue;
      }
      c.globalAlpha = t.a; c.beginPath(); c.arc(t.x, t.y, t.r, 0, Math.PI * 2); c.fill();
    }
    c.globalAlpha = 1;
    if (++kareNo % 3 === 0) {                // yığın yumuşar: dik tepeler yana kayar
      for (let i = 1; i < yigin.length - 1; i++) {
        const fark = yigin[i] - (yigin[i - 1] + yigin[i + 1]) / 2;
        if (fark > 1.2) { yigin[i] -= fark * .2; yigin[i - 1] += fark * .1; yigin[i + 1] += fark * .1; }
      }
      for (let i = 0; i < yigin.length; i++) if (yigin[i] > maxY) yigin[i] = maxY;
      yiginCiz();
    }
    requestAnimationFrame(kare);
  })();
})();

// ---------- ışık zinciri ----------
function zincirCiz() {
  const svg = $('#zincirSvg'), w = svg.clientWidth || innerWidth, ad = Math.max(8, Math.round(w / 56)), renk = ['#FF3B4E', '#35E08A', '#FFC83D', '#4FC3FF'];
  let yol = 'M0 6', ampul = '';
  for (let i = 0; i < ad; i++) {
    const x1 = (i + .5) * (w / ad), x2 = (i + 1) * (w / ad), r = renk[i % renk.length];
    yol += ` Q${x1} 26 ${x2} 6`;
    ampul += `<g class="ampul" style="animation-delay:${-(i % 5) * .35}s"><rect x="${x1 - 3}" y="14" width="6" height="5" fill="#3a463f"/>
      <ellipse cx="${x1}" cy="25" rx="5" ry="7.5" fill="${r}" style="filter:drop-shadow(0 0 6px ${r})"/></g>`;
  }
  svg.setAttribute('viewBox', `0 0 ${w} 40`);
  svg.innerHTML = `<path d="${yol}" fill="none" stroke="#2c3832" stroke-width="2"/>${ampul}`;
}
zincirCiz(); addEventListener('resize', zincirCiz);

// ---------- 3D sandık ----------
function sandikHtml(sinif = '', stil = '') {
  return `<div class="sandik ${sinif}" style="${stil}" aria-hidden="true"><div class="sandik-3d">
    <div class="yz g-alt"></div><div class="yz g-arka"></div><div class="yz g-sol"></div><div class="yz g-sag"></div><div class="yz g-isik"></div>
    <div class="yz g-on"><span class="kilit"></span></div>
    <div class="kapak"><div class="yz k-alt"></div><div class="yz k-arka"></div><div class="yz k-sol"></div><div class="yz k-sag"></div><div class="yz k-ust"></div><div class="yz k-on"></div></div>
  </div></div>`;
}

// ---------- geri sayım ----------
function sayacHtml() {
  return `<div><div class="sayac-etiket">Yılbaşına kalan</div><div class="sayac" id="sayac" role="timer" aria-live="off">
    ${['GÜN', 'SAAT', 'DAK', 'SAN'].map((b) => `<div class="sayac-kutu"><b>00</b><span>${b}</span></div>`).join('')}</div></div>`;
}
function sayacBaslat() {
  clearInterval(sayacZaman);
  const hedef = new Date(new Date().getFullYear() + 1, 0, 1).getTime();
  const guncelle = () => {
    const kutu = $('#sayac'); if (!kutu) return clearInterval(sayacZaman);
    const f = Math.max(0, Math.floor((hedef - Date.now()) / 1000));
    const d = [Math.floor(f / 86400), Math.floor(f / 3600) % 24, Math.floor(f / 60) % 60, f % 60];
    kutu.querySelectorAll('b').forEach((b, i) => { b.textContent = String(d[i]).padStart(2, '0'); });
    kutu.setAttribute('aria-label', `Yılbaşına ${d[0]} gün ${d[1]} saat ${d[2]} dakika`);
  };
  guncelle(); sayacZaman = setInterval(guncelle, 1000);
}

// ---------- pencere ----------
function pencere(icerik, butonlar) {
  return new Promise((coz) => {
    const onceki = document.activeElement;
    const p = el(`<div class="pencere"><div class="cerceve" role="dialog" aria-modal="true" aria-labelledby="p-baslik"><div class="ic">${icerik}<div class="butonlar"></div></div></div></div>`);
    const kapat = (d) => { p.remove(); document.removeEventListener('keydown', tus); onceki?.focus?.(); coz(d); };
    const tus = (e) => {
      if (e.key === 'Escape') kapat(false);
      if (e.key === 'Tab') { const f = [...p.querySelectorAll('button')], i = f.indexOf(document.activeElement);
        if (e.shiftKey && i <= 0) { e.preventDefault(); f.at(-1).focus(); } else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); } }
    };
    for (const b of butonlar) { const x = el(`<button class="${b.sinif || 'oyun-btn'}">${b.yazi}</button>`); x.onclick = () => kapat(b.deger); $('.butonlar', p).append(x); }
    p.addEventListener('click', (e) => { if (e.target === p) kapat(false); });
    document.addEventListener('keydown', tus); document.body.append(p); $('.butonlar button:last-child', p).focus();
  });
}
const onayla = (ust, baslik, mesaj, evet) => pencere(`<span class="ust-etiket">${ust}</span><h3 id="p-baslik">${baslik}</h3><p>${mesaj}</p>`,
  [{ yazi: 'Vazgeç', sinif: 'metin-btn', deger: false }, { yazi: evet, deger: true }]);
$('#navNasil').onclick = () => pencere(`<span class="ust-etiket">Rehber</span><h3 id="p-baslik">Nasıl oynanır?</h3><ol>
  <li><span><b>Çekilişi oluştur</b> ve kodu ya da linki arkadaşlarınla paylaş.</span></li>
  <li><span><b>Herkes lobiye katılır</b> ve adını yazar.</span></li>

  <li><span><b>Herkes sandığını açar</b> ve hediye alacağı kişiyi görür.</span></li></ol>`, [{ yazi: 'Anladım', deger: true }]);

    <div class="ikili">

        <label class="etiket" for="ad">Çekilişin adı</label>

        <div class="kod-alan" id="kodAlan"><label class="sr" for="kodGir">Lobi kodu, 6 karakter</label>

    </div>

  $('#olusturBtn').onclick = async () => {
    $('#olusturBtn').disabled = true;
    try { const o = await istek('odalar', { ad: $('#ad').value }); yaz('yonetici:' + o.kod, o.yoneticiAnahtari); location.href = '/?oda=' + o.kod; }

function kisiselLinkHtml() {

  return `<details class="kisisel"><summary>Başka cihazdan girmek için kişisel linkin</summary>

}
function odaSayfasi() {

  const kk = $('#kodKopya');

  const sol = $('#sol');

  let durum;
  if (!b && !o.cekildi) {
    durum = el(`<section class="cerceve altin durum" aria-labelledby="d-b"><div class="ic">

    durum = el(`<section class="cerceve altin durum" aria-labelledby="d-b"><div class="ic"><div class="sandik-hazir">
      <div class="mini-sandik"><div class="aura"></div>${sandikHtml('salin', '--w:120px;--h:74px;--d:86px;--lh:33px')}</div>
      <div><span class="ust-etiket altin">${b.acti ? 'Sandık açıldı' : 'Eşleştirme tamam'}</span>
        <h2 id="d-b">${b.acti ? 'Hediye alacağın kişi' : 'Sandığın hazır!'}</h2>
        <p>${b.acti ? `<b style="color:var(--altin);font-size:22px;font-family:var(--f-oyun);text-transform:uppercase">${metin(b.hedef)}</b><br><span class="soluk">Bu bir sır — kimseye söyleme.</span>`
          : 'Sandığını aç ve hediye alacağın kişiyi gör.'}</p>
        <button class="oyun-btn buyuk${b.acti ? '' : ' kirmizi'}" id="acBtn">${b.acti ? 'Açılışı tekrar izle' : '🎁 Sandığı aç'}</button></div>
    </div>${kisiselLinkHtml()}</div></section>`);
  } else {
    durum = el(`<section class="cerceve durum"><div class="ic"><span class="ust-etiket">Lobi kapandı</span><h2>Eşleştirme tamamlandı</h2>
      <p>Bu çekilişe artık katılım yok. Katıldıysan, katıldığın cihazdan ya da kişisel linkinle gir.</p></div></section>`);
  }
  sol.append(durum);
  const gk = $('#gizliKopya');
  if (gk) gk.onclick = async () => { try { await navigator.clipboard.writeText(odaLinki(odaKodu) + '&t=' + oku('token:' + odaKodu)); gk.textContent = 'Kopyalandı ✓'; } catch { gk.textContent = 'Elle kopyala'; } };
  if ($('#katilBtn')) {
    $('#katilBtn').onclick = async () => {
      const btn = $('#katilBtn'); btn.disabled = true;
      try {
        const r = await istek(`odalar/${odaKodu}/katil`, { isim: $('#isim').value });
        yaz('token:' + odaKodu, r.token);
        const k = btn.getBoundingClientRect();
        await yukle(true);
        konfeti(k.left + k.width / 2, k.top, undefined, 90);
        bildirim('Lobiye katıldın', 'Hoş geldin! 🎄');
      } catch (e) { $('#hk').textContent = e.message; btn.disabled = false; }
    };
    enterIle('#isim', '#katilBtn');
  }
  if ($('#acBtn')) $('#acBtn').onclick = () => sandikSahnesi(!!b.acti);

  if (S.yk) {
    const yeterli = n >= 3;
    const y = el(`<section class="cerceve" aria-labelledby="y-b"><div class="ic">
      <div class="panel-baslik"><h3 id="y-b">🎅 Çekiliş yöneticisi</h3><span class="ust-etiket">Yalnızca sen görüyorsun</span></div>
      <div class="yonetici-satir"><span class="ust-etiket altin" style="letter-spacing:.18em">Davet linki</span><code>${metin(odaLinki(odaKodu))}</code><button class="cizgi-btn" id="linkKopya">Kopyala</button></div>
      ${o.cekildi ? `<div class="satir-yazi"><span>Açılan sandıklar</span><span>${acan}/${n}</span></div><div class="ilerleme" style="margin-top:6px"><i style="width:${n ? acan / n * 100 : 0}%"></i></div>`
        : `<div class="satir-yazi"><span>Lobi</span><span>${n} oyuncu ${yeterli ? '· hazır' : '· en az 3 gerekli'}</span></div><div class="ilerleme" style="margin-top:6px"><i style="width:${Math.min(100, n / 3 * 100)}%"></i></div>
        <div class="yonetici-alt"><span class="soluk" style="font-size:14px">Başlatınca lobi kapanır, geri alınamaz.</span>
          <button class="oyun-btn kirmizi buyuk" id="eslestirBtn" ${yeterli ? '' : 'disabled'}>⚡ Eşleştirmeyi başlat</button></div>`}
      <div class="hata" id="hy" role="alert"></div></div></section>`);
    sol.append(y);
    $('#linkKopya').onclick = async () => { try { await navigator.clipboard.writeText(odaLinki(odaKodu)); $('#linkKopya').textContent = 'Kopyalandı ✓'; } catch { $('#linkKopya').textContent = 'Elle kopyala'; } };
    if ($('#eslestirBtn')) $('#eslestirBtn').onclick = eslestirmeSahnesi;
  }

  const p = el(`<section class="cerceve" aria-labelledby="l-b"><div class="ic"><div class="panel-baslik"><h3 id="l-b">Lobi</h3><span class="ust-etiket">${n} oyuncu</span></div><div class="lobi-liste" role="list"></div></div></section>`);
  const liste = $('.lobi-liste', p);
  if (!n) liste.append(el('<div class="bos">Lobi boş — ilk oyuncu sen ol.</div>'));
  o.katilimcilar.forEach((k, i) => {
    const sen = b && b.id === k.id;
    const d = o.cekildi ? (k.acti ? '<span class="alt acti">🎁 Sandığı açtı</span>' : '<span class="alt">Sandık bekliyor</span>') : '<span class="alt hazir">● Hazır</span>';
    const r = el(`<div class="oyuncu${sen ? ' sen' : ''}" role="listitem" style="animation-delay:${Math.min(i, 12) * 45}ms">${avatar(k.isim)}
      <span class="bilgi"><span class="isim">${metin(k.isim)}</span>${d}</span>${sen ? '<span class="etiket-sen">SEN</span>' : ''}</div>`);
    if (S.yk && !o.cekildi) {
      const x = el(`<button class="at-btn" aria-label="${metin(k.isim)} adlı oyuncuyu lobiden çıkar">✕</button>`);
      x.onclick = async () => {
        if (!(await onayla('Lobi', 'Oyuncuyu çıkar?', `<b>${metin(k.isim)}</b> lobiden çıkarılacak.`, 'Çıkar'))) return;
        try { await istek(`odalar/${odaKodu}/cikar`, { yoneticiAnahtari: S.yk, id: k.id }); yukle(true); } catch (e) { pencere(`<h3 id="p-baslik">Olmadı</h3><p>${metin(e.message)}</p>`, [{ yazi: 'Tamam', deger: 1 }]); }
      };
      r.append(x);
    }
    liste.append(r);
  });
  if (b && !o.cekildi) {
    const u = el('<p style="margin:14px 0 0;font-size:14px" class="soluk">Bu sen değil misin? <button class="metin-btn" id="unutBtn">Bu cihazdaki kaydı unut</button></p>');
    $('.ic', p).append(u); $('#unutBtn', u).onclick = () => { yaz('token:' + odaKodu, null); yukle(true); };
  }
  $('#sag').append(p);
}

// =========================================================
// SAHNE: EŞLEŞTİRME (yönetici)
// =========================================================
async function eslestirmeSahnesi() {
  const o = S.oda, n = o.katilimcilar.length;
  if (!(await onayla('Eşleştirme', 'Eşleştirme başlasın mı?', `${n} oyuncu birbirine eşleştirilecek. Lobi kapanır ve bu işlem geri alınamaz.`, '⚡ Başlat'))) return;
  S.sahneAcik = true; clearTimeout(yoklama);
  const s = el(`<div class="sahne" role="dialog" aria-modal="true" aria-labelledby="es-b"><div class="sahne-ic">
    <span class="ust-etiket altin">${metin(o.ad)}</span><h2 id="es-b">Eşleştiriliyor</h2>
    <div class="eslesme-radar"><b id="esYuzde">0%</b></div>
    <div class="ilerleme"><i id="esBar" style="width:0%"></i></div>
    <div class="eslesme-liste">${o.katilimcilar.map((k) => `<div class="e-oyuncu">${avatar(k.isim)}<small>${metin(k.isim)}</small><em>ARANIYOR</em></div>`).join('')}</div>
    <div class="sahne-butonlar" style="opacity:1"><span class="hata" id="esHata" role="alert"></span></div>
  </div></div>`);
  document.body.append(s);
  const kartlar = [...s.querySelectorAll('.e-oyuncu')];
  const animasyon = (async () => {
    const sira = kartlar.map((_, i) => i).sort(() => Math.random() - .5);
    for (let i = 0; i < sira.length; i++) {
      await bekle(hareketAz() ? 0 : Math.max(140, 1600 / n));
      const k = kartlar[sira[i]]; k.classList.add('tamam'); $('em', k).textContent = 'EŞLEŞTİ ✓';
      const y = Math.round((i + 1) / n * 100); $('#esYuzde').textContent = y + '%'; $('#esBar').style.width = y + '%';
    }
  })();
  try {
    await Promise.all([istek(`odalar/${odaKodu}/cek`, { yoneticiAnahtari: S.yk }), animasyon]);
    $('#es-b').textContent = 'Herkes eşleşti! 🎄';
    $('#esYuzde').textContent = '✓';
    konfeti(innerWidth / 2, innerHeight * .4);
    $('.sahne-butonlar', s).innerHTML = '<button class="oyun-btn buyuk" id="esKapat">Lobiye dön</button>';
    $('#esKapat').focus();
    await new Promise((r) => ($('#esKapat').onclick = r));
  } catch (e) { $('#esHata').textContent = e.message; await bekle(2200); }
  s.remove(); S.sahneAcik = false;
  await yukle(true);
}

// =========================================================
// SAHNE: SANDIK AÇILIŞI
// =========================================================
const GEREKEN_DOKUNUS = 3;
function sandikSahnesi(tekrar) {
  const b = S.ben; if (!b?.hedef) return;
  S.sahneAcik = true; clearTimeout(yoklama);
  const onceki = document.activeElement;
  const s = el(`<div class="sahne" role="dialog" aria-modal="true" aria-labelledby="sa-b">
    <button class="kapat-x" aria-label="Kapat">✕</button><div class="flas"></div>
    <div class="sahne-ic">
      <span class="ust-etiket altin">Hediye sandığı</span><h2 id="sa-b">Sandığını aç</h2>
      <div class="acilis-alan" role="button" tabindex="0" aria-label="Sandık. Açmak için ${GEREKEN_DOKUNUS} kez dokun ya da Enter'a bas.">
        <div class="huzme"></div><div class="aura"></div><div class="zemin-halka" style="bottom:40px"></div>
        ${sandikHtml('salin', '--s:1.15')}
        <div class="sonuc-kart"><div class="kart-sonuc"><div class="ic"><span class="ust-etiket altin">Hediye alacağın kişi</span><span class="ikon" aria-hidden="true">🎁</span>
          <span class="isim">${metin(b.hedef)}</span><span class="alt-yazi">BU BİR SIR</span></div></div></div>
      </div>
      <div class="ipucu" aria-live="polite">Sandığa dokun</div>
      <div class="pipler" aria-hidden="true">${'<i></i>'.repeat(GEREKEN_DOKUNUS)}</div>
      <div class="sahne-butonlar"><button class="oyun-btn" id="saKapat">Tamam</button></div>
    </div></div>`);
  document.body.append(s);
  const alan = $('.acilis-alan', s), sandik = $('.sandik', s), ipucu = $('.ipucu', s), pipler = s.querySelectorAll('.pipler i');
  let dokunus = 0, kilit = false, acildi = false;
  const kapat = () => { document.removeEventListener('keydown', tus); s.remove(); S.sahneAcik = false; onceki?.focus?.(); yukle(true); };
  const tus = (e) => { if (e.key === 'Escape' && !kilit) kapat(); };
  document.addEventListener('keydown', tus);
  $('.kapat-x', s).onclick = kapat; $('#saKapat', s).onclick = kapat;
  alan.focus();

  async function ac() {
    kilit = true; acildi = true;
    ipucu.textContent = 'Açılıyor…';
    sandik.classList.remove('salin', 'zipla'); sandik.classList.add('titre', 'guclu');
    await bekle(hareketAz() ? 0 : 900);
    sandik.classList.remove('titre', 'guclu'); sandik.classList.add('acik');
    s.classList.add('patladi');
    await bekle(hareketAz() ? 0 : 650);
    s.classList.add('kart-acik');
    $('#sa-b').textContent = 'Mutlu yıllar! 🎄';
    ipucu.textContent = 'Bu bir sır — kimseye söyleme'; ipucu.style.animation = 'none';
    alan.setAttribute('aria-label', `Sandık açıldı. Hediye alacağın kişi: ${b.hedef}`);
    const r = alan.getBoundingClientRect();
    konfeti(r.left + r.width / 2, r.top + r.height / 2, undefined, 220);
    setTimeout(() => konfeti(r.left + r.width / 2, r.top + r.height / 2, ['#FFC83D', '#ffffff'], 100), 450);
    if (!tekrar) { try { const d = await istek(`odalar/${odaKodu}/ac`, { token: oku('token:' + odaKodu) }); b.acti = d.acti; } catch {} }
    kilit = false; $('#saKapat', s).focus();
  }
  function dokun() {
    if (kilit || acildi) return;
    dokunus++;
    pipler.forEach((p, i) => p.classList.toggle('dolu', i < dokunus));
    try { navigator.vibrate && navigator.vibrate(dokunus < GEREKEN_DOKUNUS ? 30 : [40, 40, 120]); } catch {}
    if (dokunus >= GEREKEN_DOKUNUS) return ac();
    sandik.classList.remove('zipla', 'salin'); void sandik.offsetWidth; sandik.classList.add('zipla');
    ipucu.textContent = dokunus === GEREKEN_DOKUNUS - 1 ? 'Bir kez daha!' : 'Sandık titriyor…';
  }
  alan.addEventListener('click', dokun);
  alan.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); dokun(); } });
}

// =========================================================
// VERİ
// =========================================================
async function yukle(zorla) {
  if (!odaKodu) { anaSayfa(); return; }
  let oda, ben = null;
  try { oda = await istek('odalar/' + odaKodu); }
  catch {
    uyg.innerHTML = `<section class="kilitli-ekran"><div class="kilit-buyuk" aria-hidden="true">❄️</div><h2>Lobi bulunamadı</h2>
      <p>${metin(odaKodu)} kodlu bir çekiliş yok. Kodu kontrol edip tekrar dene.</p><a class="oyun-btn" href="/">Ana sayfaya dön</a></section>`;
    return;
  }
  const token = oku('token:' + odaKodu);
  if (token) { try { ben = await istek(`odalar/${odaKodu}/ben?token=${encodeURIComponent(token)}`); } catch { yaz('token:' + odaKodu, null); } }
  const oncekiCekildi = S.oda?.cekildi;
  const degisti = zorla || JSON.stringify([oda, ben]) !== JSON.stringify([S.oda, S.ben]);
  S.oda = oda; S.ben = ben; S.yk = oku('yonetici:' + odaKodu);
  if (oncekiCekildi === false && oda.cekildi && ben && !S.yk) bildirim('Eşleştirme tamamlandı', 'Sandığın hazır! 🎁');
  if (degisti && !S.sahneAcik) {
    const odak = document.activeElement, acikDetay = document.querySelector('details.kisisel[open]');
    const yeniCekildi = oncekiCekildi === false && oda.cekildi;
    if (!zorla && !yeniCekildi && ((odak && odak.matches('input')) || acikDetay)) { /* kullanıcı bir şeyle ilgilenirken bozma */ } else odaSayfasi();
  }
  clearTimeout(yoklama);
  yoklama = setTimeout(() => { if (!S.sahneAcik && !$('.pencere')) yukle(false); else yoklama = setTimeout(() => yukle(false), 4000); }, oda.cekildi ? 15000 : 4000);
}
yukle(true);
</script>
</body>
</html>
